services:
  hub:
    build: .
    ports:
      - "8000:8000"
    environment:
      HUB_PUBLIC: "1"
      HUB_DB: /data/hub.db
      HUB_SOLANA_CLUSTER: devnet
      HUB_SOLANA_RPC: https://api.devnet.solana.com
    volumes:
      - hub_data:/data
      - chroma_data:/app/chroma_db
    restart: unless-stopped

volumes:
  hub_data:
  chroma_data:
