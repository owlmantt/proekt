services:
  - type: web
    name: mcp-context-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: HUB_PUBLIC
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: HUB_SOLANA_CLUSTER
        value: devnet
      - key: HUB_SOLANA_RPC
        value: https://api.devnet.solana.com
